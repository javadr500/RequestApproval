<h2>Register</h2>

<form [formGroup]="form" (ngSubmit)="submit()">

  <div>
    <label>Email</label>

    <input
      type="email"
      formControlName="email">
  </div>

  <div>
    <label>Password</label>

    <input
      type="password"
      formControlName="password">
  </div>

  @if (error) {
    <p>{{ error }}</p>
  }

  <button type="submit">
    Register
  </button>

</form>
